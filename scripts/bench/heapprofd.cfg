# Perfetto config for a native heap profile of the example app on Android
# (used by scripts/bench/heap.mjs). heapprofd samples malloc, and with
# all_heaps also the ART heap, from the moment the process starts, so start
# the trace before launching the app. The example's manifest is
# <profileable android:shell="true"/>, which is what lets the shell attach
# to a release build.
buffers {
  size_kb: 131072
  fill_policy: RING_BUFFER
}
data_sources {
  config {
    name: "android.heapprofd"
    heapprofd_config {
      sampling_interval_bytes: 2048
      process_cmdline: "com.rollingnumberexample"
      shmem_size_bytes: 8388608
      block_client: true
      all_heaps: true
    }
  }
}
duration_ms: 60000
