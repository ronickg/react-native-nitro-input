name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'packages/react-native-nitro-rolling-number/cpp/**'
      - 'packages/react-native-nitro-input/cpp/**'
      - 'BENCHMARKS.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install
        working-directory: docs
        run: npm ci
      # The live demos run the real engines compiled to WebAssembly. Rebuild
      # them here so a change to cpp/ never deploys with a stale build.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Build the engines to WebAssembly
        working-directory: docs
        run: npm run build:wasm && npm run build:wasm:morph
      - name: Build
        working-directory: docs
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
