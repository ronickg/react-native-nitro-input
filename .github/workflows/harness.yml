name: Harness

# The on-device suites (example/__tests__/*.harness.tsx) run inside the
# example app through React Native Harness: the packages' handles, events,
# formatter and layout, on an Android emulator and an iOS simulator. The
# libraries' own compile checks live in packages.yml; this is what an app
# sees when it uses them.
on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'example/**'
      - 'patches/**'
      - 'bun.lock'
      - '.github/workflows/harness.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'example/**'
      - 'patches/**'
      - 'bun.lock'
      - '.github/workflows/harness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  android:
    name: Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # What the runner image can create: an API 35 x86_64 image with the Play-less Google APIs.
      HARNESS_ANDROID_EMULATOR: harness_api35
      HARNESS_ANDROID_API_LEVEL: '35'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: NDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" > /dev/null'
      - uses: gradle/actions/setup-gradle@v4
      # The whole example app, for the one ABI the emulator runs.
      - name: Build the example app
        working-directory: example/android
        run: >
          ./gradlew :app:assembleDebug
          -PreactNativeArchitectures=x86_64
          --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the suites
        uses: callstackincubator/react-native-harness@v1.5.0
        with:
          runner: android
          # Relative to projectRoot, like everything the action resolves.
          app: android/app/build/outputs/apk/debug/app-debug.apk
          projectRoot: example
          packageManager: bun
          preRunHook: |
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 1

  ios:
    name: iOS simulator
    # Xcode 26 is the default here; its simulators are the iPhone 17 family on iOS 26.5.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      HARNESS_IOS_SIMULATOR: iPhone 17
      HARNESS_IOS_SIMULATOR_VERSION: '26.5'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: example
      - name: Pods
        working-directory: example/ios
        env:
          LANG: en_US.UTF-8
        run: bundle exec pod install
      - name: Build the example app
        working-directory: example/ios
        run: >
          set -o pipefail &&
          xcodebuild
          -workspace RollingNumberExample.xcworkspace
          -scheme RollingNumberExample
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
          build | xcbeautify --quiet
      # A fresh runner takes minutes to boot a simulator, longer than Harness
      # waits by default; booted here, Harness finds it ready, as it does locally.
      - name: Boot the simulator
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r --arg name "$HARNESS_IOS_SIMULATOR" --arg os "$HARNESS_IOS_SIMULATOR_VERSION" '.devices | to_entries[] | select(.key | endswith("iOS-" + ($os | gsub("\\."; "-")))) | .value[] | select(.name == $name) | .udid' | head -1)
          test -n "$udid" || { echo "no $HARNESS_IOS_SIMULATOR / iOS $HARNESS_IOS_SIMULATOR_VERSION simulator on this image"; xcrun simctl list devices available; exit 1; }
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      - name: Run the suites
        uses: callstackincubator/react-native-harness@v1.5.0
        with:
          runner: ios
          app: ios/build/Build/Products/Debug-iphonesimulator/RollingNumberExample.app
          projectRoot: example
          packageManager: bun
